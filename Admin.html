<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-gray-900 via-gray-800 to-black flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-gray-800/60 backdrop-blur-lg rounded-2xl shadow-2xl border border-gray-700">
    <div class="p-8">
      <div class="text-center mb-8">
        <div class="mx-auto bg-gradient-to-r from-purple-600 to-indigo-600 w-16 h-16 rounded-xl flex items-center justify-center mb-4">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
        </div>
        <h1 class="text-2xl font-bold text-white">Panel Admin</h1>
        <p class="text-gray-400 mt-1">Acceso restringido</p>
      </div>

      <form class="space-y-5">
        <div>
          <input type="email" placeholder="Usuario o correo"
            class="w-full px-4 py-3.5 bg-gray-900/70 border border-gray-700 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition" />
        </div>
        <div>
          <input type="password" placeholder="Contraseña"
            class="w-full px-4 py-3.5 bg-gray-900/70 border border-gray-700 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition" />
        </div>
        <button type="submit"
          class="w-full py-3.5 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 text-white font-medium rounded-xl shadow-lg hover:shadow-purple-500/20 transition duration-300 transform hover:-translate-y-0.5">
          Acceder
        </button>
      </form>

      <!-- Enlace de registro (opcional en admin) -->
      <div class="text-center mt-6">
        <p class="text-gray-500 text-sm">
          ¿No tienes cuenta? 
          <a href="#" class="font-medium text-purple-400 hover:text-purple-300 transition">
            Regístrate aquí
          </a>
        </p>
      </div>
    </div>
  </div>
</body>
</html>
